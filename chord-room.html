<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#46413f">
  <title>Chord Room — Personal Guitar Chord Library</title>
  <meta name="description" content="A warm, personal guitar chord library for songs, artists and chord diagrams.">
  <meta property="og:title" content="Chord Room">
  <meta property="og:description" content="Personal Guitar Chord Library">
  <meta property="og:image" content="og.png">
  <style>
    :root {
      --stage:#b6a8a2; --canvas:#f7f5f2; --surface:#fffdf9; --surface-2:#efede9;
      --sidebar:#46413f; --sidebar-2:#3b3735; --text:#24211f; --muted:#8c8580;
      --line:#ddd8d2; --accent:#bb5523; --accent-2:#d8ca47; --teal:#789e91;
      --danger:#b33e3e; --success:#4b7b62; --shadow:0 24px 70px rgba(45,36,32,.22);
      --radius-xl:28px; --radius-lg:22px; --radius-md:16px; --sidebar-w:214px;
    }
    [data-theme="dark"] {
      --stage:#171614; --canvas:#242321; --surface:#302e2b; --surface-2:#3a3733;
      --sidebar:#191817; --sidebar-2:#11100f; --text:#f5f1eb; --muted:#aaa29b;
      --line:#494540; --accent:#d66a36; --accent-2:#d8ca47; --teal:#88aa9f;
      --danger:#df6d68; --success:#71a887; --shadow:0 24px 75px rgba(0,0,0,.44);
    }
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{min-height:100dvh;margin:0;background:
      radial-gradient(circle at 18% 9%,rgba(255,255,255,.32),transparent 24rem),
      linear-gradient(140deg,var(--stage),color-mix(in srgb,var(--stage),#6f625c 18%));
      color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}
    button{color:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent),transparent 55%);outline-offset:2px}
    img{display:block;max-width:100%}
    .hidden{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .app-stage{min-height:100dvh;padding:28px 28px 108px}
    .app-shell{width:min(1440px,100%);min-height:calc(100dvh - 136px);margin:auto;background:var(--canvas);border-radius:var(--radius-xl);box-shadow:var(--shadow);display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);overflow:clip;position:relative}
    .sidebar{background:linear-gradient(165deg,var(--sidebar),var(--sidebar-2));color:#f7f4f1;padding:28px 22px 30px;display:flex;flex-direction:column;min-height:100%;z-index:30}
    .brand{display:flex;align-items:center;gap:12px;margin:0 8px 34px}
    .brand-mark{width:38px;height:38px;border-radius:13px;background:var(--accent-2);color:#2e2a27;display:grid;place-items:center;transform:rotate(-5deg);box-shadow:0 7px 18px rgba(0,0,0,.22)}
    .brand h1{font-size:15px;letter-spacing:.12em;margin:0;text-transform:uppercase}
    .brand p{font-size:10px;color:#c9c1bc;margin:2px 0 0}
    .nav-group{margin:0 0 23px}
    .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#b7afaa;margin:0 10px 9px}
    .nav-btn{border:0;background:transparent;color:#d8d2ce;width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:13px;cursor:pointer;text-align:left;font-size:13px;margin:2px 0;transition:.18s ease}
    .nav-btn svg{width:17px;height:17px;opacity:.78;flex:0 0 auto}
    .nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
    .nav-btn.active{background:#f5f1ec;color:#25211f;font-weight:700}
    .nav-btn.active svg{opacity:1}
    .sidebar-footer{margin-top:auto}
    .mini-stat{border-top:1px solid rgba(255,255,255,.11);padding:17px 9px 0;color:#c9c1bc;font-size:11px;line-height:1.6}
    .main{min-width:0;display:flex;flex-direction:column}
    .topbar{min-height:78px;padding:17px 25px;display:grid;grid-template-columns:minmax(160px,1fr) minmax(260px,520px) minmax(160px,1fr);gap:18px;align-items:center;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--canvas),transparent 3%);position:sticky;top:0;z-index:22}
    .breadcrumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .breadcrumb b{color:var(--text)}
    .search-wrap{position:relative}
    .search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;color:var(--muted);pointer-events:none}
    .global-search{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:15px;padding:0 84px 0 43px;box-shadow:0 4px 14px rgba(55,43,37,.04)}
    .search-hint{position:absolute;right:11px;top:10px;border:1px solid var(--line);border-radius:7px;font-size:10px;color:var(--muted);padding:4px 7px;background:var(--surface-2)}
    .top-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}
    .icon-btn,.soft-btn,.primary-btn,.danger-btn{border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s ease}
    .icon-btn{width:39px;height:39px;border-radius:13px;background:transparent}
    .icon-btn:hover{background:var(--surface-2)}
    .icon-btn svg{width:18px;height:18px}
    .avatar{width:35px;height:35px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#e9954b);color:white;font-size:11px;font-weight:800;display:grid;place-items:center}
    .primary-btn{background:var(--accent);color:white;border-radius:13px;padding:11px 16px;font-weight:750;box-shadow:0 8px 18px color-mix(in srgb,var(--accent),transparent 72%)}
    .primary-btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
    .soft-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
    .soft-btn:hover{background:color-mix(in srgb,var(--surface-2),var(--accent) 8%)}
    .danger-btn{background:var(--danger);color:white;border-radius:12px;padding:10px 14px;font-weight:700}
    .content{padding:24px;min-width:0;flex:1}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:0 0 20px}
    .eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
    .page-title{font-size:clamp(27px,3vw,42px);letter-spacing:-.04em;line-height:1.04;margin:0}
    .page-sub{color:var(--muted);font-size:13px;margin:7px 0 0}
    .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px}
    .hero{min-height:260px;border-radius:var(--radius-lg);overflow:hidden;position:relative;background:
      radial-gradient(circle at 75% 46%,rgba(255,211,111,.42),transparent 13rem),
      linear-gradient(125deg,#8d321a,var(--accent) 52%,#d77c38);color:white;padding:32px;display:flex;align-items:flex-end;isolation:isolate}
    .hero:before{content:"";position:absolute;right:-60px;top:-70px;width:310px;height:310px;border:45px solid rgba(255,255,255,.12);border-radius:50%;transform:rotate(16deg)}
    .hero:after{content:"";position:absolute;right:55px;bottom:-115px;width:255px;height:255px;border:1px solid rgba(255,255,255,.26);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.06),0 0 0 56px rgba(255,255,255,.04)}
    .hero-copy{position:relative;z-index:2;width:min(560px,78%)}
    .hero-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;opacity:.85}
    .hero h2{font-size:clamp(31px,4vw,54px);line-height:.98;letter-spacing:-.045em;margin:12px 0 8px}
    .hero-meta{font-size:13px;opacity:.83;margin-bottom:22px}
    .hero .soft-btn{background:white;color:#2a221e;border:0}
    .hero-art{position:absolute;right:7%;top:50%;transform:translateY(-50%) rotate(5deg);width:150px;aspect-ratio:1;border-radius:28px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;font-size:46px;font-weight:900;letter-spacing:-.08em;z-index:1;box-shadow:0 25px 40px rgba(73,17,4,.25);overflow:hidden}
    .hero-art img{width:100%;height:100%;object-fit:cover}
    .section{margin-top:24px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
    .section-head h3{font-size:15px;margin:0;letter-spacing:-.01em}
    .text-btn{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:5px}
    .text-btn:hover{color:var(--accent)}
    .artist-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:16px}
    .artist-card{border:0;background:transparent;cursor:pointer;text-align:center;color:inherit;padding:0;min-width:0}
    .artist-avatar{width:min(94px,100%);aspect-ratio:1;border-radius:50%;margin:0 auto 8px;background:linear-gradient(145deg,#d4ccc5,#91837b);display:grid;place-items:center;color:white;font-weight:850;font-size:23px;overflow:hidden;box-shadow:0 10px 24px rgba(55,43,37,.14);transition:.2s ease}
    .artist-card:hover .artist-avatar{transform:translateY(-3px) scale(1.02)}
    .artist-avatar img{width:100%;height:100%;object-fit:cover}
    .artist-name{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .artist-count{font-size:10px;color:var(--muted);margin-top:2px}
    .panel{background:var(--surface);border-radius:var(--radius-lg);padding:17px;border:1px solid color-mix(in srgb,var(--line),transparent 32%)}
    .now-panel{align-self:start;position:sticky;top:102px}
    .now-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .equalizer{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
    .equalizer i{width:2px;background:var(--accent);border-radius:2px;animation:eq .8s ease-in-out infinite alternate}
    .equalizer i:nth-child(2){height:11px;animation-delay:.15s}.equalizer i:nth-child(1){height:6px}.equalizer i:nth-child(3){height:8px;animation-delay:.28s}
    @keyframes eq{to{height:3px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
    .now-cover{aspect-ratio:1;border-radius:18px;background:linear-gradient(145deg,#8ca89e,#345d58);display:grid;place-items:center;color:white;font-size:40px;font-weight:900;overflow:hidden}
    .now-cover img{width:100%;height:100%;object-fit:cover}
    .now-title{font-size:16px;font-weight:800;margin:14px 0 3px}
    .now-artist{font-size:11px;color:var(--muted)}
    .now-chips{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:750;border:1px solid var(--line)}
    .song-list{display:flex;flex-direction:column;gap:4px}
    .song-row{display:grid;grid-template-columns:46px minmax(140px,1.7fr) minmax(100px,1fr) 64px 76px 76px 34px;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;cursor:pointer;transition:.16s ease}
    .song-row:hover{background:var(--surface)}
    .song-thumb{width:42px;height:42px;border-radius:10px;background:linear-gradient(145deg,#d5b29c,var(--accent));display:grid;place-items:center;color:white;font-size:12px;font-weight:850;overflow:hidden}
    .song-thumb img{width:100%;height:100%;object-fit:cover}
    .song-main{min-width:0}.song-title{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-artist{font-size:10px;color:var(--muted);margin-top:3px}
    .song-cell{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .heart-btn{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:17px}
    .heart-btn:hover{background:var(--surface-2)}.heart-btn.on{color:var(--accent)}
    .toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:17px}
    .toolbar .spacer{flex:1}
    .select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;min-height:42px;padding:9px 12px}
    .select{min-width:135px}
    .view-toggle{display:flex;background:var(--surface-2);padding:3px;border-radius:12px;border:1px solid var(--line)}
    .view-toggle button{border:0;background:transparent;border-radius:9px;padding:7px 10px;cursor:pointer;color:var(--muted)}
    .view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.07)}
    .songs-table{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line)}
    .songs-table .song-row{grid-template-columns:48px minmax(150px,1.5fr) minmax(100px,1fr) 58px 58px 90px minmax(95px,.8fr) 34px;border-radius:0;border-bottom:1px solid var(--line);padding:11px 15px}
    .songs-table .song-row:last-child{border:0}
    .table-head{background:var(--surface-2);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
    .table-head:hover{background:var(--surface-2);cursor:default}
    .song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
    .song-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;cursor:pointer;transition:.18s ease;position:relative}
    .song-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(50,39,33,.11)}
    .card-cover{aspect-ratio:4/3;border-radius:13px;background:linear-gradient(145deg,#d9b795,#ad4b28);display:grid;place-items:center;color:#fff;font-size:28px;font-weight:900;overflow:hidden;margin-bottom:11px}
    .card-cover img{width:100%;height:100%;object-fit:cover}
    .song-card .heart-btn{position:absolute;right:18px;top:18px;background:rgba(255,255,255,.88);color:#6c5e56}
    [data-theme="dark"] .song-card .heart-btn{background:rgba(30,28,26,.82);color:#eee}
    .tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
    .empty{padding:55px 24px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-lg)}
    .empty-icon{width:58px;height:58px;border-radius:19px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--accent)}
    .empty h3{margin:0 0 6px}.empty p{color:var(--muted);font-size:13px;margin:0 0 18px}
    mark{background:color-mix(in srgb,var(--accent-2),transparent 35%);color:inherit;border-radius:3px;padding:0 2px}
    .search-section{margin-bottom:27px}
    .result-count{font-size:12px;color:var(--muted);margin-left:7px}
    .artist-profile{display:grid;grid-template-columns:180px 1fr;gap:25px;align-items:end;background:linear-gradient(130deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;margin-bottom:23px}
    .artist-profile .artist-avatar{width:180px;margin:0;font-size:46px}
    .artist-profile h2{font-size:42px;letter-spacing:-.045em;margin:0 0 9px}
    .profile-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
    .song-detail-head{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:20px}
    .song-detail-art{width:110px;height:110px;border-radius:22px;background:linear-gradient(145deg,#d5b093,var(--accent));display:grid;place-items:center;color:white;font-weight:900;font-size:27px;overflow:hidden}
    .song-detail-art img{width:100%;height:100%;object-fit:cover}
    button.song-detail-art{border:0;padding:0;cursor:pointer;font-family:inherit}.artist-detail-link{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--accent);padding:0;cursor:pointer;font-family:inherit}.artist-detail-link:hover{text-decoration:underline}
    .song-detail-head h2{font-size:clamp(26px,4vw,46px);line-height:1;margin:0 0 8px;letter-spacing:-.04em}
    .detail-meta{display:flex;gap:7px;flex-wrap:wrap}
    .viewer-shell{background:color-mix(in srgb,var(--sidebar),#000 12%);border-radius:var(--radius-lg);overflow:hidden}
    .viewer-toolbar{padding:10px 13px;display:flex;align-items:center;gap:6px;color:#f6f2ef;background:rgba(0,0,0,.18);position:sticky;top:78px;z-index:8}
    .viewer-toolbar button{border:0;background:rgba(255,255,255,.1);color:white;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:11px}
    .viewer-toolbar button:hover{background:rgba(255,255,255,.2)}
    .viewer-toolbar .viewer-count{margin-left:auto;font-size:11px;color:#ddd3cc}
    .viewer-pages{padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:300px;overflow:auto}
    .viewer-page{max-width:100%;transform-origin:center top;transition:transform .18s}
    .viewer-page img{width:auto;max-width:100%;height:auto;margin:auto;background:white;box-shadow:0 10px 28px rgba(0,0,0,.28)}
    .viewer-pages.fit-width .viewer-page,.viewer-pages.fit-width img{width:100%}
    .viewer-pages.fit-page{height:72dvh}.viewer-pages.fit-page .viewer-page,.viewer-pages.fit-page img{max-height:calc(72dvh - 36px);width:auto}
    .quick-chords{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.used-chord-head-tools{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}.used-chord-switch{padding:3px;border-radius:11px}.used-chord-switch button{padding:6px 10px;border-radius:8px;font-size:10px}
    .chord-pill{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer}
    .chord-pill:hover{border-color:var(--accent);color:var(--accent)}
    .text-sheet{height:var(--text-sheet-height,clamp(420px,72dvh,780px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px}
    .transpose-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 13px;border-bottom:1px solid var(--line);background:var(--surface-2);position:static;flex:0 0 auto;z-index:7}
    .transpose-stepper{display:flex;align-items:center;gap:4px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
    .transpose-stepper button{border:0;background:transparent;color:var(--text);border-radius:9px;min-width:42px;padding:7px 10px;cursor:pointer;font-weight:900}
    .transpose-stepper button:hover{background:var(--surface-2);color:var(--accent)}
    .transpose-status{font-size:11px;color:var(--muted);font-weight:700}.transpose-status b{color:var(--text)}
    .reader-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .text-size-control{height:38px;display:flex;align-items:center;gap:5px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:10px;font-weight:800;color:var(--muted)}
    .text-size-control button{height:28px;min-width:30px;padding:0 7px;border:0;border-radius:8px;background:var(--surface-2);color:var(--text);font-weight:900;cursor:pointer}
    .text-size-control button:hover{color:var(--accent)}.text-size-control button.is-active{background:var(--accent);color:white}
    .simplify-btn.is-active{background:var(--accent);border-color:var(--accent);color:white}
    .text-size-control output{min-width:34px;text-align:center;color:var(--text);font-variant-numeric:tabular-nums}
    .speed-control{height:38px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:10px;font-weight:800;color:var(--muted)}
    .speed-control input{width:92px;accent-color:var(--accent);cursor:pointer}.speed-control output{min-width:48px;color:var(--text);font-variant-numeric:tabular-nums}
    .chord-text{margin:0;padding:22px 22px 112px;min-height:0;flex:1 1 auto;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;white-space:pre;tab-size:4;color:var(--text);font:600 14px/1.9 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .chord-text.wrap-lines{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
    .text-sheet:fullscreen,.text-sheet:-webkit-full-screen,.text-sheet.text-fullscreen{width:100%;height:100dvh;max-height:none;margin:0;border:0;border-radius:0;background:var(--surface)}
    .text-sheet:fullscreen .chord-text,.text-sheet:-webkit-full-screen .chord-text,.text-sheet.text-fullscreen .chord-text{padding-bottom:28px}
    .text-sheet.text-fullscreen{position:fixed;inset:0;z-index:240}
    body.text-fullscreen-open{overflow:hidden}
    .chord-token,.inline-chord{color:var(--accent);font-weight:900}
    .inline-chord{display:inline-block;background:color-mix(in srgb,var(--accent),transparent 88%);border-radius:5px;padding:0 4px;margin:0 1px;line-height:1.55}
    .chord-paste-input{min-height:260px!important;font:600 13px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre;tab-size:4}
    .field-help{margin:-1px 0 0;color:var(--muted);font-size:10px;line-height:1.5}

    if(t.hasAttribute('data-next-recent')){
      var recent=state.songs.filter(function(s){return s.lastViewed&&s.id!==state.settings.currentSongId}).sort(function(a,b){return new Date(b.lastViewed)-new Date(a.lastViewed)});
      if(recent.length)await openSong(recent[0].id);else toast('No other recent songs');return;
    }
    if(t.dataset.view){
      state.params.view=t.dataset.view;state.settings.defaultView=t.dataset.view;await saveSettings();render();return;
    }
    if(t.dataset.filter){return}
    if(t.dataset.viewer){
      var act=t.dataset.viewer;
      if(act==='in')state.viewerZoom=Math.min(2.5,state.viewerZoom+.15);
      if(act==='out')state.viewerZoom=Math.max(.45,state.viewerZoom-.15);
      if(act==='prev'||act==='next'){
        var songV=state.songs.find(function(s){return s.id===state.params.id}),total=songV?(songV.images||[]).length:0;
        if(total){state.viewerPage=Math.max(0,Math.min(total-1,state.viewerPage+(act==='next'?1:-1)));var pg=document.querySelector('[data-page="'+state.viewerPage+'"]');if(pg)pg.scrollIntoView({behavior:'smooth',block:'start'});var count=document.getElementById('viewerCount');if(count)count.textContent=(state.viewerPage+1)+' / '+total}
        return;
      }
      if(act==='width'){state.viewerFit='width';state.viewerZoom=1}
      if(act==='page'){state.viewerFit='page';state.viewerZoom=1}
      if(act==='rotate')state.viewerRotation=(state.viewerRotation+90)%360;
      if(act==='full'){var shell=document.getElementById('viewerShell');if(shell.requestFullscreen)shell.requestFullscreen();return}
      applyViewer();return;
    }
    if(t.dataset.imageAction){
      var item=t.closest('[data-image-index]'),idx=Number(item.dataset.imageIndex),actI=t.dataset.imageAction;
      if(actI==='up')moveFormImage(idx,-1);
      if(actI==='down')moveFormImage(idx,1);
      if(actI==='rotate'){state.formImages[idx].rotation=((state.formImages[idx].rotation||0)+90)%360;renderImageManager()}
      if(actI==='delete'){state.formImages.splice(idx,1);renderImageManager()}
      if(actI==='replace'){
        var picker=document.createElement('input');picker.type='file';picker.accept='image/jpeg,image/png,image/webp';
        picker.addEventListener('change',function(){var f=picker.files[0];if(f){state.formImages[idx]=Object.assign({},state.formImages[idx],{name:f.name,type:f.type,blob:f});renderImageManager();toast('Image replaced')}});picker.click();
      }
      return;
    }
    var action=t.dataset.action,id=t.dataset.id;
    if(!action)return;
    if(action==='add-song'){songForm(null,t.dataset.artist||'');return}
    if(action==='add-artist'){artistForm(null);return}
    if(action==='edit-artist'){artistForm(state.artists.find(function(a){return a.id===id}));return}
    if(action==='favorite-artist'){await toggleArtistFavorite(id);return}
    if(action==='delete-artist'){await deleteArtist(id);return}
    if(action==='edit-song'){songForm(state.songs.find(function(s){return s.id===id}));return}
    if(action==='song-menu'){songMenu(id);return}
    if(action==='delete-song'){await deleteSong(id);return}
    if(action==='export-song'){await exportOneSong(id);return}
    if(action==='copy-transposed'){
      var currentTextSong=state.songs.find(function(s){return s.id===state.params.id});if(currentTextSong)await copyText(transposeChordTextPlain(currentTextSong.chordText||'',state.songTranspose,state.songSimplified));return;
    }
    if(action==='toggle-simplified'){state.songSimplified=!state.songSimplified;updateTextTranspose();updateReaderControls();toast(state.songSimplified?'Simplified chords on':'Original chords restored');return}
    if(action==='toggle-autoscroll'){toggleAutoScroll();return}
    if(action==='toggle-reader-wrap'){await toggleReaderWrap();return}
    if(action==='toggle-text-fullscreen'){await toggleTextFullscreen();return}
    if(action==='export-library'){await exportLibrary();return}
    if(action==='restore-library'){var inp=document.getElementById('restoreInput');if(inp)inp.click();return}
    if(action==='clear-demo'){await clearDemo();return}
    if(action==='clear-search'){state.query='';document.getElementById('globalSearch').value='';render();return}
    if(action==='toggle-favorites'){state.params.favorites=state.params.favorites?'':'1';render();return}
    if(action==='clear-filters'){state.params={view:state.params.view||state.settings.defaultView,sort:'recent'};render();return}
    if(action==='toggle-bar'){state.settings.barCollapsed=!state.settings.barCollapsed;await saveSettings();render();return}
  });
  document.addEventListener('change',async function(e){
    var el=e.target;
    if(el.dataset.filter){state.params[el.dataset.filter]=el.value;render();return}
    if(el.id==='restoreInput'&&el.files[0]){await previewRestore(el.files[0]);return}
    if(el.id==='setTheme'){state.settings.theme=el.value;await saveSettings();toast('Theme updated');return}
    if(el.id==='setView'){state.settings.defaultView=el.value;await saveSettings();toast('Default view updated');return}
    if(el.id==='setFingers'){state.settings.showFingers=el.value==='show';await saveSettings();toast('Chord diagrams updated');return}
    if(el.id==='setRecent'){state.settings.recentLimit=Number(el.value);await saveSettings();toast('History limit updated');return}
    if(el.id==='setFit'){state.settings.imageFit=el.value;await saveSettings();toast('Viewer setting updated');return}
  });
  document.getElementById('globalSearch').addEventListener('input',debounce(function(e){
    state.query=e.target.value;state.page='search';state.params={};render();
  },75));
  document.addEventListener('input',function(e){if(e.target.id==='autoScrollSpeed')setAutoScrollSpeed(e.target.value)});
  document.getElementById('quickAdd').addEventListener('click',function(){songForm(null,'')});
  document.getElementById('quickTheme').addEventListener('click',async function(){
    var current=document.documentElement.getAttribute('data-theme');state.settings.theme=current==='dark'?'light':'dark';await saveSettings();toast(state.settings.theme==='dark'?'Dark mode on':'Light mode on');
  });
  document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
  document.addEventListener('keydown',function(e){
    var tag=(document.activeElement&&document.activeElement.tagName)||'',typing=/INPUT|TEXTAREA|SELECT/.test(tag);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus();document.getElementById('globalSearch').select()}
    else if(e.key==='/'&&!typing){e.preventDefault();document.getElementById('globalSearch').focus()}
    else if(e.key==='Escape'){if(document.getElementById('cropperRoot').innerHTML)closeCoverCropper();else if(state.textPseudoFullscreen)setPseudoTextFullscreen(false);else if(document.getElementById('modalRoot').innerHTML)closeModal();else document.getElementById('sidebar').classList.remove('open')}
    if((e.key==='Enter'||e.key===' ')&&!typing){
      var target=e.target.closest('[data-open-song],[data-open-artist],[data-open-chord]');if(target&&!target.matches('button')){e.preventDefault();target.click()}
    }
  });
  function handleTextFullscreenChange(){updateReaderControls();if(!textReaderIsFullscreen())requestAnimationFrame(fitTextSheetToViewport)}
  document.addEventListener('fullscreenchange',handleTextFullscreenChange);document.addEventListener('webkitfullscreenchange',handleTextFullscreenChange);
  matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(state.settings.theme==='system')applyTheme()});
  var fitReaderOnResize=debounce(fitTextSheetToViewport,80);window.addEventListener('resize',fitReaderOnResize);if(window.visualViewport)window.visualViewport.addEventListener('resize',fitReaderOnResize);
  window.addEventListener('beforeunload',revokeUrls);

  // ==========================================
  // INITIALIZE
  // ==========================================
  (async function init(){
    try{
      await openDB();await loadData();await seedDemo();buildNavigation();applyTheme();render();
      document.getElementById('loading').classList.add('hidden');
    }catch(err){
      console.error(err);document.getElementById('loading').innerHTML='<div class="loading-box"><div class="empty-icon" style="margin:auto auto 14px">'+icon('settings',26)+'</div><b>Chord Room could not open</b><p style="color:var(--muted);font-size:12px">Please allow browser storage, then reload this page.</p></div>';
    }
  })();
  </script>
</body>
</html>
